name = "bolt-diy-nilai"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./build/client"

# Copy this file to wrangler.toml and fill in your configuration

[vars]
# Supabase Configuration
# Get these from your Supabase project dashboard
VITE_SUPABASE_URL = "https://your-project.supabase.co"
VITE_SUPABASE_ANON_KEY = "your-anon-key"

# API Keys
# Add the API keys for the providers you want to use
# ANTHROPIC_API_KEY = "your_anthropic_key"
# OPENAI_API_KEY = "your_openai_key"
# GROQ_API_KEY = "your_groq_key"
# DEEPSEEK_API_KEY = "your_deepseek_key"
# MISTRAL_API_KEY = "your_mistral_key"
# XAI_API_KEY = "your_xai_key"
# COHERE_API_KEY = "your_cohere_key"
# PERPLEXITY_API_KEY = "your_perplexity_key"
# TOGETHER_API_KEY = "your_together_key"
# HuggingFace_API_KEY = "your_huggingface_key"
# HYPERBOLIC_API_KEY = "your_hyperbolic_key"

# GitHub Integration (Optional)
# VITE_GITHUB_ACCESS_TOKEN = "your_github_token"
# VITE_GITHUB_TOKEN_TYPE = "classic"

# Logging (debug, info, warn, error)
VITE_LOG_LEVEL = "info"

# Context Optimization for Ollama (Optional)
# DEFAULT_NUM_CTX = "6144"

# Preview Deployments
[env.preview]
name = "bolt-diy-nilai-preview"

# Production Deployments
[env.production]
name = "bolt-diy-nilai-production"
